name: Release

# When a version tag (e.g. 1.0.1) is pushed, builds the plugin and creates a
# draft GitHub release. Obsidian downloads main.js, manifest.json and
# styles.css from the release assets.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  # for signed build provenance (artifact attestations) of the release assets
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title="$tag" \
            --draft \
            main.js manifest.json styles.css
